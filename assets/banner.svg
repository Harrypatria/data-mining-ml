<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Data Mining and Machine Learning Skill</title>
  <desc id="d">Banner: the plugin name above the pipeline from notebook to model bundle, API, web workbench and grounded explainer, with a small precision-recall curve.</desc>
  <rect width="1200" height="300" fill="#F7F8FA"/>
  <rect x="0" y="0" width="8" height="300" fill="#2F3E4E"/>
  <text x="64" y="112" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="46" font-weight="600" fill="#171B21">Data Mining and Machine Learning Skill</text>
  <text x="64" y="160" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="22" fill="#515966">CRISP-DM rigor from notebook to production, for Claude Code, Jupyter, Colab and VS Code</text>
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="17" fill="#2F3E4E">
    <text x="64" y="232">notebook</text><text x="176" y="232">-&gt;</text>
    <text x="214" y="232">model.pkl</text><text x="330" y="232">-&gt;</text>
    <text x="368" y="232">FastAPI</text><text x="460" y="232">-&gt;</text>
    <text x="498" y="232">React</text><text x="572" y="232">-&gt;</text>
    <text x="610" y="232">grounded explainer</text>
  </g>
  <g transform="translate(930 60)">
    <rect width="220" height="180" fill="#FFFFFF" stroke="#DDE1E7"/>
    <path d="M20 30 C 60 32, 100 45, 130 80 S 180 150, 200 160" fill="none" stroke="#0072B2" stroke-width="3"/>
    <line x1="20" y1="160" x2="200" y2="160" stroke="#98A1AE"/>
    <line x1="20" y1="20" x2="20" y2="160" stroke="#98A1AE"/>
    <circle cx="130" cy="80" r="6" fill="#D55E00"/>
    <text x="110" y="176" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#515966" text-anchor="middle">recall</text>
  </g>
</svg>
